
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Musical🎵</title>
    <link rel="icon" href="https://fav.farm/🎵">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="bg-dark text-white text-center p-4">
        <h1>🎵Catálogo Musical 🎵 </h1>
        <p>Busca canciones, artistas y álbumes</p>
    </header>

    <main class="container my-4">

        <section>
            <h2>Buscar música</h2>

            <form id="formularioBusqueda" class="d-flex gap-2 mb-3">
                <input type="text" id="busqueda" class="form-control"
                       placeholder="Escribe una canción o artista" required>
                <button type="submit" class="btn btn-primary">Buscar</button>
            </form>

        
        </section>

        <section>
            <h2>Resultados</h2>
            <p id="mensaje" role="status">
               Lista del Catalogo.
            </p>

            <div id="resultados" class="row g-3"></div>
        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">Catálogo Musical - Evaluación 2 - Diseño y Desarrollo Web - Henry Inzunza - Paulina Gonzales Peña y Lillo </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
